[project]
name = "asr-scientific-environment"
version = "0.1.0"
description = "Isolated scientific workspace and MATPOWER/pandapower calibration"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pandapower==3.5.6",
  "numpy==2.4.6",
  "scipy==1.18.1",
  "pandas==2.3.3",
  "pyarrow==26.0.0",
  "networkx==3.7",
  "matplotlib==3.11.2",
  "pytest==9.2.0",
]

[dependency-groups]
notebooks = ["jupyterlab==4.6.5", "ipykernel==7.4.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
