[project]
name = "automated-scientific-researcher"
version = "0.1.0"
description = "Durable autonomous scientific research with reproducible power-flow experiments"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "ijson==3.5.1",
    "jsonschema==4.26.0",
]

[project.optional-dependencies]
aar = [
    "claude-agent-sdk>=0.1,<1",
    "flask==3.1.2",
    "flask-sqlalchemy==3.1.1",
    "jinja2>=3.1,<4",
    "requests>=2.32,<3",
]
